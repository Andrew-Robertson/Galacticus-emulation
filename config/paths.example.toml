[paths]
galacticus_binary = "$GALACTICUS_EXEC_PATH/Galacticus.exe"
galacticus_parameter_files = "$GALACTICUS_PARAMETER_FILES"
run_root = "runs"

[defaults]
base_parameters = "$GALACTICUS_PARAMETER_FILES/hierarchicalParameters/romanEPS_local.xml"
mass_function_parameters = "$GALACTICUS_PARAMETER_FILES/hierarchicalParameters/massFunction.xml"
threads = 4

[environment]
GALACTICUS_EXEC_PATH = "/absolute/path/to/galacticus/build/or/bin"
GALACTICUS_DATA_PATH = "/absolute/path/to/galacticus/datasets"
GALACTICUS_PARAMETER_FILES = "/absolute/path/to/Galacticus-ParameterFiles"
GALACTICUS_SED_CALC_PATH = "/absolute/path/to/galacticus_sed_calculator"
SHMR_PATH = "/absolute/path/to/make-SHMR-datasets"
