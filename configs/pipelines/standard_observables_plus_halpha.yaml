# Reusable GP/MCMC pipeline for standard observables plus H-alpha Sobral LFs.
# Override ROOT and PIPELINE_OUTPUT_ROOT for a different reduced campaign.
#
#default_profiles:
  # - mcmc_transformed_parameters
  # - mcmc_de_rescue # use a mix of different emcee move types (defined below)

variables:
  # Input campaign data root. This must point at the reduced campaign containing
  # samples.csv, evaluations/, and sidecar files.
  ROOT: runs/campaigns/sobol_1024_20p_simpleSizes_moreHalos_reduced
  HDF5_FILENAME: galacticus.hdf5

  # Outputs created by this config-driven pipeline. Keeping this separate from
  # ROOT lets the pipeline recreate the existing workflow without overwriting
  # historical emulators/MCMCs at the top level of the campaign.
  PIPELINE_OUTPUT_ROOT: ${ROOT}/pipeline

  # Standard-observable emulator choice. Keep the numerical setting and the
  # output-name tag together so that changing one prompts changing the other.
  STANDARD_PCA_VARIANCE_THRESHOLD: "0.99"
  STANDARD_EMULATOR_TAG: pca_99
  STANDARD_BUNDLE: ${PIPELINE_OUTPUT_ROOT}/emulators/standard_observables/${STANDARD_EMULATOR_TAG}/standard_observables_bundle.joblib
  STANDARD_META: ${PIPELINE_OUTPUT_ROOT}/emulators/standard_observables/${STANDARD_EMULATOR_TAG}/standard_observables_bundle.meta.json

  # Sidecar LF emulator choice. The directory tag keeps the existing pca_99
  # directory convention, while the name tag keeps existing pca99 filenames.
  SIDECAR_LF_PCA_VARIANCE_THRESHOLD: "0.99"
  SIDECAR_LF_EMULATOR_DIR_TAG: pca_99
  SIDECAR_LF_EMULATOR_NAME_TAG: pca99

  # H-alpha sidecar LF training choice. The label controls output names; the
  # argument list controls which rows are used.
  HALPHA_OBSERVABLE: halpha_sobral
  HALPHA_DUST_DRAW_LABEL: 1dustdraw
  HALPHA_DUST_DRAW_ARGS:
    - --dust-draw-index
    - "0"
  HALPHA_TAG: ${HALPHA_OBSERVABLE}_${HALPHA_DUST_DRAW_LABEL}_${SIDECAR_LF_EMULATOR_NAME_TAG}
  HALPHA_BUNDLE: ${PIPELINE_OUTPUT_ROOT}/emulators/emission_line_lfs/${SIDECAR_LF_EMULATOR_DIR_TAG}/${HALPHA_TAG}.joblib

  # Two-pass MCMC workflow for the science-critical joint fits:
  #   1. exploratory: broad initialization from the prior quantile centre,
  #      used to find a high-posterior MAP point;
  #   2. production: initialized around the exploratory MAP point.
  #
  # Downstream plotting and best-fit stages use MCMC_ROOT, so production is the
  # default "science" result.
  MCMC_EXPLORATORY_ROOT: ${PIPELINE_OUTPUT_ROOT}/MCMCs_exploratory
  MCMC_PRODUCTION_ROOT: ${PIPELINE_OUTPUT_ROOT}/MCMCs_production_from_exploratory_MAP
  MCMC_ROOT: ${MCMC_PRODUCTION_ROOT}
  STANDARD_MCMC_ROOT: ${MCMC_ROOT}/standard_observables
  HALPHA_MCMC_ROOT: ${MCMC_ROOT}/emission_line_lfs/${HALPHA_TAG}
  COMBINED_MCMC_ROOT: ${MCMC_ROOT}/standard_observables_plus_emission_line_lfs/all_standard_observables_plus_${HALPHA_TAG}

  EXPLORATORY_STANDARD_MCMC_ROOT: ${MCMC_EXPLORATORY_ROOT}/standard_observables
  EXPLORATORY_ALL_STANDARD_MCMC_DIR: ${EXPLORATORY_STANDARD_MCMC_ROOT}/all_standard_observables
  EXPLORATORY_COMBINED_MCMC_ROOT: ${MCMC_EXPLORATORY_ROOT}/standard_observables_plus_emission_line_lfs/all_standard_observables_plus_${HALPHA_TAG}

  SMF_MCMC_DIR: ${STANDARD_MCMC_ROOT}/smf_z0_z3
  SFRF_MCMC_DIR: ${STANDARD_MCMC_ROOT}/sfr_function_robotham2011
  SIZE_MCMC_DIR: ${STANDARD_MCMC_ROOT}/size_mass_vdw2014_sf_q
  BH_MSIGMA_MCMC_DIR: ${STANDARD_MCMC_ROOT}/bh_velocity_dispersion
  MZR_MCMC_DIR: ${STANDARD_MCMC_ROOT}/mzr_blanc2019
  ALL_STANDARD_MCMC_DIR: ${STANDARD_MCMC_ROOT}/all_standard_observables

  SMF_PREFIX: mcmc_smf_z0_z3
  SFRF_PREFIX: mcmc_sfr_function_robotham2011
  SIZE_PREFIX: mcmc_size_mass_vdw2014_sf_q
  BH_MSIGMA_PREFIX: mcmc_bh_velocity_dispersion
  MZR_PREFIX: mcmc_mzr_blanc2019
  ALL_STANDARD_PREFIX: mcmc_all_standard_observables
  HALPHA_PREFIX: mcmc_${HALPHA_TAG}
  COMBINED_PREFIX: mcmc_all_standard_observables_plus_${HALPHA_TAG}

  BEST_FIT_GALACTICUS_EXECUTABLE: $GALACTICUS_EXEC_PATH/Galacticus.exe
  BEST_FIT_GALACTICUS_OUTPUT: romanEPS_massFunction.hdf5
  BEST_FIT_PARAMETER_FILES:
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/romanEPS.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/massFunction.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/fineTuningFiles/handCalibratedChanges.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/fineTuningFiles/odeAcc1e-4.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/fineTuningFiles/seeds/seed1234.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/fineTuningFiles/additionalQuantities.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/universeMachine/Trinity/universeMachine_Trinity_z012_outputs.xml
    - $GALACTICUS_PARAMS_PATH/starFormationHistory/adaptiveSFH-noSave.xml
    - $GALACTICUS_PARAMS_PATH/fineTuningFiles/emissionLineLuminosityFunctions.xml
    - $GALACTICUS_PARAMS_PATH/emissionLines/emissionLines.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/fineTuningFiles/sizes/galacticStructureSolver-simple.xml
    - $GALACTICUS_PARAMETER_FILES/hierarchicalParameters/fineTuningFiles/moreHalos.xml
  STANDARD_BEST_FIT_RUN_DIR: ${ALL_STANDARD_MCMC_DIR}/bestFitModel_GalacticusRun
  COMBINED_BEST_FIT_RUN_DIR: ${COMBINED_MCMC_ROOT}/bestFitModel_GalacticusRun

  # Optional emcee proposal moves. Leave empty to use emcee's default
  # StretchMove, or set via a profile / override list as repeated --move args.
  MCMC_MOVE_ARGS: []
  MCMC_SAMPLER_COORDINATE_ARGS: []
  MAP_INIT_QUANTILE_SIGMA: "0.01"
  ALL_STANDARD_EXPLORATORY_MCMC_RESULTS: ${EXPLORATORY_ALL_STANDARD_MCMC_DIR}/${ALL_STANDARD_PREFIX}_mcmc_results.hdf5
  COMBINED_EXPLORATORY_MCMC_RESULTS: ${EXPLORATORY_COMBINED_MCMC_ROOT}/${COMBINED_PREFIX}_mcmc_results.hdf5
  ALL_STANDARD_PRODUCTION_INIT_ARGS:
    - --init-from-results
    - ${ALL_STANDARD_EXPLORATORY_MCMC_RESULTS}
    - --init-source
    - map
    - --init-quantile-sigma
    - ${MAP_INIT_QUANTILE_SIGMA}
  COMBINED_PRODUCTION_INIT_ARGS:
    - --init-from-results
    - ${COMBINED_EXPLORATORY_MCMC_RESULTS}
    - --init-source
    - map
    - --init-quantile-sigma
    - ${MAP_INIT_QUANTILE_SIGMA}

  ACTUAL_STANDARD_HDF5: ${STANDARD_BEST_FIT_RUN_DIR}/${BEST_FIT_GALACTICUS_OUTPUT}
  ACTUAL_COMBINED_HDF5: ${COMBINED_BEST_FIT_RUN_DIR}/${BEST_FIT_GALACTICUS_OUTPUT}
  ACTUAL_COMBINED_SIDECAR_DIR: ${COMBINED_BEST_FIT_RUN_DIR}/emission_line_dust
  ACTUAL_COMBINED_UNIT_HDF5: ${COMBINED_MCMC_ROOT}/bestFitModel-UNIT/${HALPHA_TAG}_romanUNIT_massFunction.hdf5
  ACTUAL_COMBINED_UNIT_SIDECAR_DIR: ${COMBINED_MCMC_ROOT}/bestFitModel-UNIT/emission_line_dust
  ACTUAL_EMISSION_LINE_FIGURE_DIR: ${COMBINED_MCMC_ROOT}/figures/emission_line_lfs_actual_eps_vs_unit
  POSTERIOR_DRAW_XML_DIR: ${COMBINED_MCMC_ROOT}/posterior_draws
  POSTERIOR_DRAW_COUNT: "25"
  POSTERIOR_DRAW_SEED: "20260528"

  STANDARD_OBSERVABLE_ARGS:
    - --observable
    - bh_velocity_dispersion
    - --observable
    - smf_liwhite2009_sdss
    - --observable
    - smf_z0
    - --observable
    - smf_z3
    - --observable
    - mzr_blanc2019
    - --observable
    - sfr_function_robotham2011
    - --observable
    - size_mass_vdw2014_star_forming_z0
    - --observable
    - size_mass_vdw2014_quiescent_z0

  ALL_STANDARD_MCMC_OBSERVABLE_ARGS:
    - --observable
    - smf_z0
    - --observable
    - smf_z3
    - --observable
    - sfr_function_robotham2011
    - --observable
    - size_mass_vdw2014_star_forming_z0
    - --observable
    - size_mass_vdw2014_quiescent_z0
    - --observable
    - bh_velocity_dispersion
    - --observable
    - mzr_blanc2019

  MCMC_COMMON:
    - --n-walkers
    - "128"
    - --n-steps
    - "50000"
    - --burn-in
    - "5000"
    - --thin
    - "100"
    - --seed
    - "12345"
    - --progress

  MCMC_LONG:
    - --n-walkers
    - "128"
    - --n-steps
    - "250000"
    - --burn-in
    - "25000"
    - --thin
    - "250"
    - --seed
    - "12345"
    - --progress

  MCMC_LONG_EXPLORATORY:
    - --n-walkers
    - "128"
    - --n-steps
    - "75000"
    - --burn-in
    - "7500"
    - --thin
    - "250"
    - --seed
    - "12345"
    - --progress

  MCMC_LONG_PRODUCTION:
    - --n-walkers
    - "128"
    - --n-steps
    - "250000"
    - --burn-in
    - "25000"
    - --thin
    - "250"
    - --seed
    - "12345"
    - --progress

  MCMC_LF_COMMON:
    - --n-walkers
    - "128"
    - --n-steps
    - "250000"
    - --burn-in
    - "25000"
    - --thin
    - "250"
    - --seed
    - "12345"
    - --include-emulator-variance
    - --progress

  MCMC_LF_EXPLORATORY:
    - --n-walkers
    - "128"
    - --n-steps
    - "75000"
    - --burn-in
    - "7500"
    - --thin
    - "250"
    - --seed
    - "12345"
    - --include-emulator-variance
    - --progress

  MCMC_LF_PRODUCTION:
    - --n-walkers
    - "128"
    - --n-steps
    - "250000"
    - --burn-in
    - "25000"
    - --thin
    - "250"
    - --seed
    - "12345"
    - --include-emulator-variance
    - --progress

profiles:
  standard_pca99:
    variables:
      STANDARD_PCA_VARIANCE_THRESHOLD: "0.99"
      STANDARD_EMULATOR_TAG: pca_99

  standard_pca999:
    variables:
      STANDARD_PCA_VARIANCE_THRESHOLD: "0.999"
      STANDARD_EMULATOR_TAG: pca_999

  sidecar_lf_pca99:
    variables:
      SIDECAR_LF_PCA_VARIANCE_THRESHOLD: "0.99"
      SIDECAR_LF_EMULATOR_DIR_TAG: pca_99
      SIDECAR_LF_EMULATOR_NAME_TAG: pca99

  sidecar_lf_pca999:
    variables:
      SIDECAR_LF_PCA_VARIANCE_THRESHOLD: "0.999"
      SIDECAR_LF_EMULATOR_DIR_TAG: pca_999
      SIDECAR_LF_EMULATOR_NAME_TAG: pca999

  halpha_1dustdraw:
    variables:
      HALPHA_DUST_DRAW_LABEL: 1dustdraw
      HALPHA_DUST_DRAW_ARGS:
        - --dust-draw-index
        - "0"

  halpha_2dustdraws:
    variables:
      HALPHA_DUST_DRAW_LABEL: 2dustdraws
      HALPHA_DUST_DRAW_ARGS:
        - --dust-draw-index
        - "0"
        - --dust-draw-index
        - "1"

  halpha_4dustdraws:
    variables:
      HALPHA_DUST_DRAW_LABEL: 4dustdraws
      HALPHA_DUST_DRAW_ARGS:
        - --dust-draw-index
        - "0"
        - --dust-draw-index
        - "1"
        - --dust-draw-index
        - "2"
        - --dust-draw-index
        - "3"

  mcmc_de_mixture:
    variables:
      MCMC_MOVE_ARGS:
        - --move
        - StretchMove:0.3
        - --move
        - DEMove:0.6
        - --move
        - DESnookerMove:0.1

  mcmc_de_rescue:
    variables:
      MCMC_MOVE_ARGS:
        - --move
        - StretchMove:0.65
        - --move
        - DEMove:0.25
        - --move
        - DEMove:0.05,gamma0=1.0
        - --move
        - DESnookerMove:0.05

  mcmc_transformed_parameters:
    variables:
      MCMC_SAMPLER_COORDINATE_ARGS:
        - --sample-transformed-parameters

  long_single_observable_mcmcs:
    variables:
      # Use the same sampler length as the production joint-observable chains
      # for the individual standard-observable fits.
      MCMC_COMMON:
        - --n-walkers
        - "128"
        - --n-steps
        - "250000"
        - --burn-in
        - "25000"
        - --thin
        - "250"
        - --seed
        - "12345"
        - --progress

workflows:
  two_phase_science_mcmcs_with_bestfits:
    description: Two-phase all-standard and all-standard-plus-H-alpha MCMCs, followed by EPS Galacticus MAP reruns and overlay plots.
    jobs:
      - name: train_standard_emulators
        stages:
          - train_standard_emulators
      - name: train_halpha_emulator
        stages:
          - train_halpha_emulator
      - name: all_standard_exploratory
        depends_on:
          - train_standard_emulators
        stages:
          - run_mcmc_all_standard_exploratory
      - name: all_standard_production
        depends_on:
          - all_standard_exploratory
        stages:
          - run_mcmc_all_standard
      - name: combined_exploratory
        depends_on:
          - train_standard_emulators
          - train_halpha_emulator
        stages:
          - run_mcmc_all_standard_plus_halpha_exploratory
      - name: combined_production
        depends_on:
          - combined_exploratory
        stages:
          - run_mcmc_all_standard_plus_halpha
      - name: standard_plus_halpha_corner
        depends_on:
          - all_standard_production
          - combined_production
        stages:
          - plot_standard_plus_halpha_corner
      - name: standard_best_fit_galacticus
        depends_on:
          - all_standard_production
        stages:
          - run_standard_best_fit_galacticus
      - name: combined_best_fit_galacticus
        depends_on:
          - combined_production
        stages:
          - run_combined_best_fit_galacticus
      - name: standard_best_fit_overlay
        depends_on:
          - standard_best_fit_galacticus
        stages:
          - plot_all_standard_best_fit_with_actual
      - name: combined_best_fit_overlay
        depends_on:
          - combined_best_fit_galacticus
        stages:
          - plot_combined_best_fit_with_actual

  standard_halpha_mcmc:
    description: Concurrent standard-observable and H-alpha emulator/MCMC workflow.
    stages:
      - plot_standard_corner
      - plot_halpha_standard_corner
  standard_halpha_mcmc_with_bestfits:
    description: Concurrent emulator/MCMC workflow, plus EPS Galacticus MAP reruns.
    stages:
      - plot_standard_corner
      - plot_halpha_standard_corner
      - run_standard_best_fit_galacticus
      - run_combined_best_fit_galacticus
  standard_halpha_mcmc_compact:
    description: Fewer Slurm jobs; small plotting stages run inside the producing MCMC job where practical.
    jobs:
      - name: train_standard_emulators
        stages:
          - train_standard_emulators
      - name: train_halpha_emulator
        stages:
          - train_halpha_emulator
      - name: standard_mcmcs_and_corner
        depends_on:
          - train_standard_emulators
        stages:
          - run_standard_mcmcs
          - plot_standard_corner
      - name: halpha_and_combined_mcmcs
        depends_on:
          - train_standard_emulators
          - train_halpha_emulator
        stages:
          - run_halpha_and_combined_mcmcs
      - name: halpha_standard_corner
        depends_on:
          - standard_mcmcs_and_corner
          - halpha_and_combined_mcmcs
        stages:
          - plot_halpha_standard_corner
  standard_halpha_mcmc_compact_with_bestfits:
    description: Compact MCMC workflow, plus EPS Galacticus MAP reruns.
    jobs:
      - name: train_standard_emulators
        stages:
          - train_standard_emulators
      - name: train_halpha_emulator
        stages:
          - train_halpha_emulator
      - name: standard_mcmcs_and_corner
        depends_on:
          - train_standard_emulators
        stages:
          - run_standard_mcmcs
          - plot_standard_corner
      - name: halpha_and_combined_mcmcs
        depends_on:
          - train_standard_emulators
          - train_halpha_emulator
        stages:
          - run_halpha_and_combined_mcmcs
      - name: halpha_standard_corner
        depends_on:
          - standard_mcmcs_and_corner
          - halpha_and_combined_mcmcs
        stages:
          - plot_halpha_standard_corner
      - name: standard_best_fit_galacticus
        depends_on:
          - standard_mcmcs_and_corner
        stages:
          - run_standard_best_fit_galacticus
      - name: combined_best_fit_galacticus
        depends_on:
          - halpha_and_combined_mcmcs
        stages:
          - run_combined_best_fit_galacticus

stages:
  - name: train_standard_emulators
    description: Build the PCA-99 standard-observable emulator bundle.
    commands:
      - name: train standard-observable bundle
        argv:
          - python
          - scripts/train_interactive_observables_demo.py
          - ${ROOT}
          - --hdf5-filename
          - ${HDF5_FILENAME}
          - --emulator-mode
          - pca
          - --pca-scaling
          - standardized
          - --pca-variance-threshold
          - ${STANDARD_PCA_VARIANCE_THRESHOLD}
          - --n-restarts-optimizer
          - "4"
          - ${STANDARD_OBSERVABLE_ARGS}
          - --output-path
          - ${STANDARD_BUNDLE}

  - name: run_standard_mcmcs
    depends_on:
      - train_standard_emulators
    description: Run illustrative individual standard-observable MCMCs and the exploratory all-standard MCMC.
    commands:
      - name: smf z0+z3
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - smf_z0
          - --observable
          - smf_z3
          - --mcmc-dir
          - ${SMF_MCMC_DIR}
          - --output-prefix
          - ${SMF_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}
      - name: sfr function
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - sfr_function_robotham2011
          - --mcmc-dir
          - ${SFRF_MCMC_DIR}
          - --output-prefix
          - ${SFRF_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}
      - name: sizes
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - size_mass_vdw2014_star_forming_z0
          - --observable
          - size_mass_vdw2014_quiescent_z0
          - --mcmc-dir
          - ${SIZE_MCMC_DIR}
          - --output-prefix
          - ${SIZE_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}
      - name: bh velocity dispersion
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - bh_velocity_dispersion
          - --mcmc-dir
          - ${BH_MSIGMA_MCMC_DIR}
          - --output-prefix
          - ${BH_MSIGMA_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}
      - name: mzr
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - mzr_blanc2019
          - --mcmc-dir
          - ${MZR_MCMC_DIR}
          - --output-prefix
          - ${MZR_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}
      - name: all standard observables exploratory
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - ${ALL_STANDARD_MCMC_OBSERVABLE_ARGS}
          - --mcmc-dir
          - ${EXPLORATORY_ALL_STANDARD_MCMC_DIR}
          - --output-prefix
          - ${ALL_STANDARD_PREFIX}
          - ${MCMC_LONG}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}

  - name: run_mcmc_smf_z0_z3
    depends_on:
      - train_standard_emulators
    description: Run the SMF z0+z3 MCMC.
    commands:
      - name: smf z0+z3
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - smf_z0
          - --observable
          - smf_z3
          - --mcmc-dir
          - ${SMF_MCMC_DIR}
          - --output-prefix
          - ${SMF_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}

  - name: run_mcmc_sfr_function
    depends_on:
      - train_standard_emulators
    description: Run the Robotham SFR-function MCMC.
    commands:
      - name: sfr function
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - sfr_function_robotham2011
          - --mcmc-dir
          - ${SFRF_MCMC_DIR}
          - --output-prefix
          - ${SFRF_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}

  - name: run_mcmc_sizes
    depends_on:
      - train_standard_emulators
    description: Run the star-forming plus quiescent size-relation MCMC.
    commands:
      - name: sizes
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - size_mass_vdw2014_star_forming_z0
          - --observable
          - size_mass_vdw2014_quiescent_z0
          - --mcmc-dir
          - ${SIZE_MCMC_DIR}
          - --output-prefix
          - ${SIZE_PREFIX}
          - ${MCMC_COMMON}
          - ${MCMC_MOVE_ARGS}
          - ${MCMC_SAMPLER_COORDINATE_ARGS}

  - name: run_mcmc_bh_velocity_dispersion
    depends_on:
      - train_standard_emulators
    description: Run the black-hole velocity-dispersion MCMC.
    commands:
      - name: bh velocity dispersion
        argv:
          - python
          - scripts/run_interactive_observables_mcmc.py
          - ${STANDARD_BUNDLE}
          - --observable
          - bh_velocity_dispersion
          - --mcmc-dir
          - ${BH_MSIGMA_MCMC_DIR}
          - --output-prefix
